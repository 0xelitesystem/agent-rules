[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-rules"
version = "0.1.0"
description = "Check whether your coding agent actually followed its CLAUDE.md / AGENTS.md / .cursorrules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Salman Ahsan (RBL)" }]
keywords = ["ai-agents", "claude-code", "governance", "compliance", "devtools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/0xelitesystem/agent-rules"
Issues = "https://github.com/0xelitesystem/agent-rules/issues"

[project.scripts]
agent-rules = "agent_rules.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
