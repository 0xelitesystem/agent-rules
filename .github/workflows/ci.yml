name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: pytest -q
      - name: Regenerate demo fixtures
        run: python examples/make_demo.py
      - name: Demo check must find a high-confidence violation and gate
        run: "! agent-rules check examples/demo-session.jsonl --rules examples/CLAUDE.md --fail-on-violation"
        shell: bash
